version: 2.1

aliases:
  release-tags: &release-tags
    filters:
      tags:
        ignore: /^.*-SNAPSHOT/
      branches:
        ignore: /.*/

  release-branches: &release-branches
    filters:
      tags:
        ignore: /.*/
      branches:
        only: /^release\/.*/

  release-branches-and-main: &release-branches-and-main
    filters:
      tags:
        ignore: /.*/
      branches:
        only:
          - /^release\/.*/
          - main

  only-main-branch: &only-main-branch
    filters:
      tags:
        ignore: /.*/
      branches:
        only: main

orbs:
  revenuecat: revenuecat/sdks-common-config@4.5.1
  unity: game-ci/unity@1.7.1
  android: circleci/android@3.0.2

executors:
  unity:
    docker:
      - image: unityci/editor:ubuntu-6000.2.6f2-base-3
        environment:
          TAR_OPTIONS: --no-same-owner
          # Unity 6.2 compatibility: Set cache root for package manager
          UPM_CACHE_ROOT: /tmp/upm-cache
    resource_class: large

  unity-android:
    docker:
      - image: unityci/editor:ubuntu-6000.2.6f2-android-3
        environment:
          UPM_CACHE_ROOT: /tmp/upm-cache
    resource_class: large

  unity-ios:
    docker:
      - image: unityci/editor:ubuntu-6000.2.6f2-ios-3
        environment:
          UPM_CACHE_ROOT: /tmp/upm-cache
    resource_class: large

parameters:
   action:
     type: enum
     enum: [build, upgrade-hybrid-common, bump]
     default: build
   version:
     type: string
     default: ''
   automatic:
     type: boolean
     default: false

commands:
  import-package:
    description: "Import Purchases.unitypackage"
    steps:
      # When importing the unity package in the following step, Unity tries to compile the project.
      # The project is referencing Purchases, but the Purchases plugin hasn't been imported yet, so the
      # compilation fails. Temporarily removing scripts that reference any dependency before importing the
      # package is a way to avoid the compilation issues.
      - run:
          name: Temporarily remove scripts
          command: |
            mv IntegrationTests/Assets/Editor/CIEditorScript.cs IntegrationTests/Assets/Editor/CIEditorScript.cs.break
            mv IntegrationTests/Assets/Main.cs IntegrationTests/Assets/Main.cs.break
            # Hide API fixtures and tests until the SDK assemblies have been imported.
            find IntegrationTests/Assets/APITests IntegrationTests/Assets/Tests \
              -type f \( -name "*.cs" -o -name "*.asmdef" \) \
              -exec sh -c 'for file do mv "$file" "$file.break"; done' sh {} +


      - run:
          name: Import Purchases package
          command: |
            /opt/unity/Editor/Unity \
              -projectPath IntegrationTests \
              -quit \
              -batchmode \
              -nographics \
              -logFile /dev/stdout \
              -disable-assembly-updater \
              -importPackage ../Purchases.unitypackage

      - run:
          name: Import PurchasesUI package
          command: |
            /opt/unity/Editor/Unity \
              -projectPath IntegrationTests \
              -quit \
              -batchmode \
              -nographics \
              -logFile /dev/stdout \
              -disable-assembly-updater \
              -importPackage ../PurchasesUI.unitypackage

      - run:
          name: Bring scripts back
          command: |
            mv IntegrationTests/Assets/Editor/CIEditorScript.cs.break IntegrationTests/Assets/Editor/CIEditorScript.cs
            mv IntegrationTests/Assets/Main.cs.break IntegrationTests/Assets/Main.cs
            find IntegrationTests/Assets/APITests IntegrationTests/Assets/Tests \
              -type f -name "*.break" \
              -exec sh -c 'for file do mv "$file" "${file%.break}"; done' sh {} +

  perform-build:
    description: "Builds Unity project"
    parameters:
      project:
        type: string
      target:
        type: string
    steps:
      - run:
          name: Build Unity project and export it
          command: |
            set -euo pipefail
            /opt/unity/Editor/Unity \
              -projectPath << parameters.project >> \
              -quit \
              -batchmode \
              -buildTarget << parameters.target >> \
              -customBuildTarget << parameters.target >> \
              -customBuildName << parameters.target >> \
              -customBuildPath build \
              -customBuildOptions AcceptExternalModificationsToPlayer \
              -executeMethod BuildCommand.PerformBuild \
              -nographics \
              -disable-assembly-updater \
              -logFile /dev/stdout

  resolve-dependencies:
    description: "Resolve Dependencies"
    parameters:
      project:
        type: string
      target:
        type: string
    steps:
      - run:
          name: Resolve project dependencies
          command: |
            /opt/unity/Editor/Unity \
              -projectPath << parameters.project >> \
              -batchmode \
              -buildTarget << parameters.target >> \
              -customBuildTarget << parameters.target >> \
              -customBuildOptions AcceptExternalModificationsToPlayer \
              -executeMethod BuildCommand.Resolve \
              -nographics \
              -disable-assembly-updater \
              -logFile /dev/stdout

  copy-api-tests-and-utils-to-subtester:
    description: "Copy APITests from IntegrationTests to Subtester"
    steps:
      - run:
          name: "Copy APITests from IntegrationTests to Subtester"
          command: |
            mkdir Subtester/Assets/APITests
            mkdir Subtester/Assets/Editor
            cp -r IntegrationTests/Assets/APITests/*.cs Subtester/Assets/APITests/
            cp IntegrationTests/Assets/Editor/CIEditorScript.cs Subtester/Assets/Editor/CIEditorScript.cs

  install-bundle-dependencies:
    parameters:
      directory:
        type: string
        default: .
    steps:
      - restore_cache:
          keys:
            # This cache key should be updated whenever we change the Ruby version
            - v5-gem-cache-{{ checksum "Gemfile.lock" }}-{{ arch }}-ruby-3.3.0
      # Ruby 3.3.0 via mise (see mise.toml). rbenv is deprecated here in favor of mise.
      # rb-readline is added in IntegrationTests/Gemfile to avoid a Ruby 3.3+/fastlane
      # terminfo crash on macOS (https://github.com/fastlane/fastlane/issues/21794).
      - revenuecat/install-mise-tools:
          tools: ruby
      - run:
          name: Verify Ruby version
          command: ruby -v
      - run:
          name: Bundle install
          working_directory: << parameters.directory >>
          command: |
            bundle config set --local clean 'true'
            bundle config set --local path 'vendor/bundle'
            bundle install
      - save_cache:
          # This cache key should be updated whenever we change the Ruby version
          key: v5-gem-cache-{{ checksum "Gemfile.lock" }}-{{ arch }}-ruby-3.3.0
          paths:
            - vendor/bundle

  replace-maestro-api-key:
    steps:
      - run:
          name: Replace API key
          command: |
            CS_PATH=e2e-tests/MaestroTestApp/Assets/Scripts/MaestroTestApp.cs
            if [ -z "$RC_E2E_TEST_API_KEY_PRODUCTION_TEST_STORE" ]; then
              echo "RC_E2E_TEST_API_KEY_PRODUCTION_TEST_STORE is not set (is the e2e-tests context attached?)"
              exit 1
            fi
            # `|` as the delimiter so a key containing a slash can't break the expression.
            sed -i "s|MAESTRO_TESTS_REVENUECAT_API_KEY|$RC_E2E_TEST_API_KEY_PRODUCTION_TEST_STORE|g" "$CS_PATH"
            # An unreplaced placeholder configures the SDK with a bogus key, which only
            # surfaces much later as an unexplained Maestro assertion failure.
            if grep -q MAESTRO_TESTS_REVENUECAT_API_KEY "$CS_PATH"; then
              echo "API key placeholder was not replaced in $CS_PATH"
              exit 1
            fi
            echo "API key placeholder replaced"
jobs:
  check-meta-files:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Check for missing .meta files
          command: bash scripts/check-meta-files.sh

  check-android-keep-annotations:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Test the @Keep check against its fixtures
          command: bash scripts/test-check-android-keep-annotations.sh
      - run:
          name: Check Android Java types are annotated with @Keep
          command: bash scripts/check-android-keep-annotations.sh

  export-package:
    executor: unity

    steps:
      - checkout

      - unity/prepare-env:
          project-path: Subtester

      - run:
          name: Export Unity Package
          description: Creating Purchases.unitypackage, this may take a minute.
          command: |
            ./scripts/create-unity-package.sh -u /opt/unity/Editor/Unity -v

      - persist_to_workspace:
          root: .
          paths:
            - Purchases.unitypackage
            - PurchasesUI.unitypackage

      - store_artifacts:
          path: Purchases.unitypackage

      - store_artifacts:
          path: PurchasesUI.unitypackage

  build-subtester-android:
    resource_class: large
    executor: unity-android
    steps:
      - checkout
      - attach_workspace:
          at: .

      - copy-api-tests-and-utils-to-subtester

      - unity/prepare-env:
          project-path: Subtester

      - resolve-dependencies:
          project: Subtester
          target: Android

      - unity/build:
          project-path: Subtester
          build-target: Android
          build-name: Android
          build-method: BuildCommand.PerformBuild
          custom-parameters: |
            -customBuildOptions AcceptExternalModificationsToPlayer

      - run:
          name: Verify APK exists
          command: test -f Subtester/Builds/Android/Android.apk

      - store_artifacts:
          path: Subtester/Builds/Android/Android.apk

  build-subtester-ios:
    executor: unity-ios
    steps:
      - checkout
      - attach_workspace:
          at: .

      - copy-api-tests-and-utils-to-subtester

      - unity/prepare-env:
          project-path: Subtester

      - resolve-dependencies:
          project: Subtester
          target: iOS

      - perform-build:
          project: Subtester
          target: iOS

      - persist_to_workspace:
          root: .
          paths:
            - Subtester/buildiOS

  build-integration-tests-android:
    resource_class: large
    executor: unity-android
    steps:
      - checkout
      - attach_workspace:
          at: .

      - unity/prepare-env:
          project-path: IntegrationTests

      - import-package

      - resolve-dependencies:
          project: IntegrationTests
          target: Android

      - unity/build:
          project-path: IntegrationTests
          build-target: Android
          build-name: Android
          build-method: BuildCommand.PerformBuild
          custom-parameters: |
            -customBuildOptions AcceptExternalModificationsToPlayer
      
      - run:
          name: Verify APK exists
          command: test -f IntegrationTests/Builds/Android/Android.apk

      - store_artifacts:
          path: IntegrationTests/Builds/Android/Android.apk

  test-edit-mode:
    executor: unity
    steps:
      - checkout
      - attach_workspace:
          at: .

      - unity/prepare-env:
          project-path: IntegrationTests

      - import-package

      - unity/test:
          project-path: IntegrationTests
          test-platform: editmode
          custom-parameters: -disable-assembly-updater

      - store_artifacts:
          path: IntegrationTests/editmode-results.xml

      - store_artifacts:
          path: IntegrationTests/editmode-junit-results.xml

  build-integration-tests-ios:
    executor: unity-ios
    parameters:
      variant:
        type: enum
        enum: [spm, cocoapods]
        default: spm
    steps:
      - checkout
      - attach_workspace:
          at: .

      - unity/prepare-env:
          project-path: IntegrationTests

      - import-package

      - when:
          condition:
            equal: [cocoapods, << parameters.variant >>]
          steps:
            - run:
                name: Disable SPM in iOS Resolver settings
                command: |
                  XML=IntegrationTests/ProjectSettings/GvhProjectSettings.xml
                  if grep -q SwiftPackageManagerEnabled "$XML"; then
                    sed -i 's|SwiftPackageManagerEnabled" value="True"|SwiftPackageManagerEnabled" value="False"|' "$XML"
                  else
                    sed -i 's|</projectSettings>|  <projectSetting name="Google.IOSResolver.SwiftPackageManagerEnabled" value="False" />\n</projectSettings>|' "$XML"
                  fi

      - resolve-dependencies:
          project: IntegrationTests
          target: iOS

      - perform-build:
          project: IntegrationTests
          target: iOS

      - run:
          name: Move build to variant-specific dir
          command: mv IntegrationTests/buildiOS IntegrationTests/buildiOS-<< parameters.variant >>

      - persist_to_workspace:
          root: .
          paths:
            - IntegrationTests/buildiOS-<< parameters.variant >>

  archive-ios:
    description: "Run iOS integration tests for Unity"
    parameters:
      variant:
        type: enum
        enum: [spm, cocoapods]
        default: spm
    macos:
      xcode: 16.4.0
    steps:
      - checkout
      - attach_workspace:
          at: .

      - install-bundle-dependencies:
          directory: IntegrationTests

      - when:
          condition:
            equal: [cocoapods, << parameters.variant >>]
          steps:
            - restore_cache:
                key: 2-pods-<< parameters.variant >>-{{ checksum "RevenueCat/Plugins/Editor/RevenueCatDependencies.xml" }}-{{ checksum "RevenueCatUI/Plugins/Editor/RevenueCatUIDependencies.xml" }}

            - run:
                name: Install Pods
                working_directory: IntegrationTests/buildiOS-<< parameters.variant >>
                command: |
                  RETRY_COUNT=0
                  MAX_RETRIES=3
                  until bundle exec pod install --repo-update --verbose; do
                    RETRY_COUNT=$((RETRY_COUNT + 1))
                    if [ "$RETRY_COUNT" -ge "$MAX_RETRIES" ]; then
                      echo "pod install failed after $MAX_RETRIES attempts"
                      exit 1
                    fi
                    echo "pod install failed (attempt $RETRY_COUNT/$MAX_RETRIES), clearing CDN cache and retrying in 60s..."
                    rm -rf ~/.cocoapods/repos/trunk
                    sleep 60
                  done

            - save_cache:
                key: 2-pods-<< parameters.variant >>-{{ checksum "RevenueCat/Plugins/Editor/RevenueCatDependencies.xml" }}-{{ checksum "RevenueCatUI/Plugins/Editor/RevenueCatUIDependencies.xml" }}
                paths:
                  - IntegrationTests/buildiOS-<< parameters.variant >>/Pods

      - run:
          name: Setup fastlane
          working_directory: IntegrationTests/buildiOS-<< parameters.variant >>
          command: ln -s ../fastlane .

      - when:
          condition:
            equal: [cocoapods, << parameters.variant >>]
          steps:
            - run:
                name: Archive
                working_directory: IntegrationTests/buildiOS-<< parameters.variant >>
                command: bundle exec fastlane archive workspace:"buildiOS-<< parameters.variant >>/Unity-iPhone.xcworkspace"

      - when:
          condition:
            equal: [spm, << parameters.variant >>]
          steps:
            - run:
                name: Archive
                working_directory: IntegrationTests/buildiOS-<< parameters.variant >>
                command: bundle exec fastlane archive project:"buildiOS-<< parameters.variant >>/Unity-iPhone.xcodeproj"

  github-release:
    description: "Creates a github release"
    docker:
      - image: cimg/ruby:3.3.0
    steps:
      - checkout
      - attach_workspace:
          at: .
      - revenuecat/install-gem-unix-dependencies:
          cache-version: v1
      - revenuecat/trust-github-key
      - revenuecat/setup-git-credentials
      - run:
          name: release
          command: bundle exec fastlane github_release

  build-maestro-test-app-android:
    executor: unity-android
    steps:
      - checkout
      - unity/prepare-env:
          project-path: e2e-tests/MaestroTestApp
      - replace-maestro-api-key
      - run:
          name: Build Maestro test app (Unity Android)
          command: |
            /opt/unity/Editor/Unity \
              -projectPath e2e-tests/MaestroTestApp \
              -quit \
              -batchmode \
              -buildTarget Android \
              -executeMethod BuildScript.BuildAndroid \
              -nographics \
              -logFile /dev/stdout
      - persist_to_workspace:
          root: .
          paths:
            - e2e-tests/MaestroTestApp/build/android

  build-maestro-test-app-ios:
    executor: unity-ios
    steps:
      - checkout
      - unity/prepare-env:
          project-path: e2e-tests/MaestroTestApp
      - replace-maestro-api-key
      - run:
          name: Build Maestro test app (Unity iOS)
          command: |
            /opt/unity/Editor/Unity \
              -projectPath e2e-tests/MaestroTestApp \
              -quit \
              -batchmode \
              -buildTarget iOS \
              -executeMethod BuildScript.BuildIOS \
              -nographics \
              -logFile /dev/stdout
      - persist_to_workspace:
          root: .
          paths:
            - e2e-tests/MaestroTestApp/build/ios

  run-maestro-e2e-tests-ios:
    macos:
      xcode: 26.3.0
    resource_class: m4pro.medium
    steps:
      - checkout
      - attach_workspace:
          at: .
      - install-bundle-dependencies
      - run:
          name: Install Java for Maestro
          command: |
            # `brew install` exits non-zero when a dependency's post-install step fails
            # (glib's does on this image) even though openjdk@17 itself installs fine, so
            # don't let that abort the step. The `java -version` check below is what
            # actually verifies the JDK is usable.
            brew install openjdk@17 || echo "brew install exited non-zero, verifying the JDK anyway"
            # openjdk@17 is keg-only, so point JAVA_HOME at the keg directly instead
            # of symlinking into /Library/Java/JavaVirtualMachines (which doesn't
            # necessarily exist on the runner) and resolving it via java_home.
            JAVA_HOME="$(brew --prefix openjdk@17)/libexec/openjdk.jdk/Contents/Home"
            "$JAVA_HOME/bin/java" -version
            echo "export JAVA_HOME=$JAVA_HOME" >> "$BASH_ENV"
            echo "export PATH=$JAVA_HOME/bin:\$PATH" >> "$BASH_ENV"
      - revenuecat/install-maestro
      - run:
          name: Boot iOS Simulator
          command: xcrun simctl boot "iPhone 17" || true
          background: true
      - run:
          name: Build the Unity-generated Xcode project
          command: bundle exec fastlane xcode_build_maestro_test_app
      - run:
          name: Wait for iOS Simulator
          command: xcrun simctl bootstatus "iPhone 17" -b
      - run:
          name: Run Maestro E2E Tests (iOS)
          command: bundle exec fastlane run_maestro_e2e_tests_ios
          no_output_timeout: 15m
      - run:
          name: Capture simulator diagnostics on failure
          command: |
            mkdir -p fastlane/test_output/diagnostics
            # Simulator crashes are written to the host's DiagnosticReports directory.
            cp ~/Library/Logs/DiagnosticReports/MaestroTestApp*.ips \
              fastlane/test_output/diagnostics/ 2>/dev/null || echo "no crash reports found"
            xcrun simctl spawn booted log show --last 15m --style compact \
              --predicate 'process == "MaestroTestApp"' \
              > fastlane/test_output/diagnostics/app.log 2>&1 || true
          when: on_fail
      - store_test_results:
          path: fastlane/test_output
      - store_artifacts:
          path: fastlane/test_output

  run-maestro-e2e-tests-android:
    machine:
      image: android:2025.10.1
    resource_class: xlarge
    shell: /bin/bash --login -o pipefail
    steps:
      - checkout
      - attach_workspace:
          at: .
      - revenuecat/install-gem-unix-dependencies:
          cache-version: v1
      - android/create_avd:
          avd_name: test-e2e
          system_image: system-images;android-34;google_apis;x86_64
          install: true
      - android/start_emulator:
          avd_name: test-e2e
          post_emulator_launch_assemble_command: ""
      - revenuecat/install-maestro
      - run:
          name: Run Maestro E2E Tests (Android)
          command: bundle exec fastlane run_maestro_e2e_tests_android
          no_output_timeout: 15m
      - run:
          name: Capture logcat on failure
          command: |
            mkdir -p fastlane/test_output
            adb logcat -d > fastlane/test_output/logcat.txt 2>&1 || true
          when: on_fail
      - store_test_results:
          path: fastlane/test_output
      - store_artifacts:
          path: fastlane/test_output

  update-hybrid-common-versions:
    description: "Creates a PR updating purchases-hybrid-common to latest release"
    docker:
      - image: cimg/ruby:3.3.0
    steps:
      - checkout
      - revenuecat/install-gem-mac-dependencies:
          cache-version: v1
      - revenuecat/trust-github-key
      - revenuecat/setup-git-credentials
      - run:
          name: Updating to next version of phc
          command: |
            bundle exec fastlane update_hybrid_common \
            version:<< pipeline.parameters.version >> \
            open_pr:true \
            automatic_release:<< pipeline.parameters.automatic >>

workflows:
  version: 2
  danger:
    when:
      and:
        - not:
            equal: [ scheduled_pipeline, << pipeline.trigger_source >> ]
        - equal: [ build, << pipeline.parameters.action >> ]
    jobs:
      - revenuecat/danger:
          ruby_version: "3.3.0"

  deploy-check:
    when:
      and:
        - not:
            equal: [ scheduled_pipeline, << pipeline.trigger_source >> ]
        - equal: [ build, << pipeline.parameters.action >> ]
    jobs:
      - check-meta-files
      - check-android-keep-annotations
      - export-package:
          context: unity
      - build-subtester-android:
          context: unity
      - build-subtester-ios:
          context: unity
      - build-integration-tests-android:
          context: unity
          requires:
            - export-package
      - test-edit-mode:
          context: unity
          requires:
            - export-package
      - build-integration-tests-ios:
          variant: spm
          context: unity
          requires:
            - export-package
      - build-integration-tests-ios:
          name: build-integration-tests-ios-cocoapods
          variant: cocoapods
          context: unity
          requires:
            - export-package
      - archive-ios:
          variant: spm
          requires:
            - build-integration-tests-ios
      - archive-ios:
          name: archive-ios-cocoapods
          variant: cocoapods
          requires:
            - build-integration-tests-ios-cocoapods
      - build-maestro-test-app-android:
          context:
            - e2e-tests
            - unity
      - build-maestro-test-app-ios:
          context:
            - e2e-tests
            - unity
      - run-maestro-e2e-tests-ios:
          context:
            - e2e-tests
          requires:
            - build-maestro-test-app-ios
      - run-maestro-e2e-tests-android:
          context:
            - e2e-tests
          requires:
            - build-maestro-test-app-android
      - hold:
          type: approval
          requires:
            - check-android-keep-annotations
            - build-integration-tests-android
            - test-edit-mode
            - build-subtester-android
            - build-subtester-ios
            - archive-ios
            - archive-ios-cocoapods
            - run-maestro-e2e-tests-ios
            - run-maestro-e2e-tests-android
          <<: *release-branches
      - revenuecat/tag-current-branch:
          ruby_version: "3.3.0"
          requires:
            - hold
          <<: *release-branches

  deploy:
    when:
      and:
        - not:
            equal: [ scheduled_pipeline, << pipeline.trigger_source >> ]
        - equal: [ build, << pipeline.parameters.action >> ]
    jobs:
      - export-package:
          context: unity
          <<: *release-tags
      - github-release:
          requires:
            - export-package
          <<: *release-tags
      - revenuecat/merge-release-pr:
          repo_name: purchases-unity
          requires:
            - github-release
          <<: *release-tags

  weekly-run-workflow:
    when:
      and:
        - equal: [ scheduled_pipeline, << pipeline.trigger_source >> ]
        - equal: [ "release-train", << pipeline.schedule.name >> ]
    jobs:
      - revenuecat/automatic-bump:
          ruby_version: "3.3.0"

  manual-trigger-bump:
    when:
      equal: [ bump, << pipeline.parameters.action >> ]
    jobs:
      - revenuecat/automatic-bump:
          ruby_version: "3.3.0"

  maestro-e2e-tests-ios:
    when:
      or:
        - equal: ["maestro_e2e_tests", << pipeline.schedule.name >>]
    jobs:
      - build-maestro-test-app-ios:
          context:
            - e2e-tests
            - unity
      - run-maestro-e2e-tests-ios:
          context:
            - e2e-tests
          requires:
            - build-maestro-test-app-ios

  maestro-e2e-tests-android:
    when:
      or:
        - equal: ["maestro_e2e_tests", << pipeline.schedule.name >>]
    jobs:
      - build-maestro-test-app-android:
          context:
            - e2e-tests
            - unity
      - run-maestro-e2e-tests-android:
          context:
            - e2e-tests
          requires:
            - build-maestro-test-app-android

  update-hybrid-common-versions:
    when:
      equal: [ upgrade-hybrid-common, << pipeline.parameters.action >> ]
    jobs:
      - update-hybrid-common-versions
