# Presents the default_workflows offering, closes it to show its configured exit offer, then
# closes the exit offer and verifies the result returned to C#.

appId: com.revenuecat.automatedsdktests
name: Paywall exit offer dismissal returns cancelled result

---
- launchApp:
    clearState: true
    arguments:
      e2e_test_flow: paywall_exit_offer_dismisses
- extendedWaitUntil: { visible: "Present Paywall", timeout: 15000 }
- tapOn: { text: "Present Paywall" }
- extendedWaitUntil:
    visible: "Start Your Free Week And Reclaim 30+ Minutes Daily"
    timeout: 15000
- tapOn: { text: "Continue 1/3" }
- extendedWaitUntil:
    visible: "Most People Feel Calmer After Just 3 Sessions"
    timeout: 15000
- tapOn: { text: "Continue 2/3" }
- extendedWaitUntil:
    visible: "People Who Meditate Daily Sleep 40% Better"
    timeout: 15000
# Close the last page to show its exit offer.
- tapOn: { text: "Close Paywall" }
- extendedWaitUntil:
    visible: "Unlock full access"
    timeout: 15000
# Close the exit offer and verify the dismissal result returned to Unity.
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: { point: "89%,5%" }
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: { point: "92%,8%" }
- extendedWaitUntil:
    visible: "Paywall result: Cancelled"
    timeout: 8000
- assertNotVisible: "Unlock full access"
- takeScreenshot: "paywall_exit_offer_dismisses"
