appId: ${APP_ID}
name: Reveal navigation controls and wait for them to hide
---
- runFlow:
    when:
      true: ${NAVIGATION_EDGE == 'bottom'}
    commands:
      - swipe:
          start: "50%,99%"
          end: "50%,80%"
          duration: 300
- runFlow:
    when:
      true: ${NAVIGATION_EDGE == 'right'}
    commands:
      - swipe:
          start: "99%,50%"
          end: "80%,50%"
          duration: 300
- runFlow:
    when:
      true: ${NAVIGATION_EDGE == 'left'}
    commands:
      - swipe:
          start: "1%,50%"
          end: "20%,50%"
          duration: 300
- extendedWaitUntil:
    visible:
      id: "com.android.systemui:id/back"
    timeout: 5000
- extendedWaitUntil:
    notVisible:
      id: "com.android.systemui:id/back"
    timeout: 15000
